<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversor de garajes</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f17;color:#e8edf6;font:16px/1.6 system-ui,Segoe UI,sans-serif}
  main{width:min(92vw,560px);background:#121826;border:1px solid #263148;border-radius:14px;padding:2rem}
  h1{margin:0 0 .5rem;font-size:1.5rem}
  p{color:#8c98b0;margin:.25rem 0 1.25rem}
  input[type=file]{width:100%;padding:1rem;background:#1a2233;border:1px dashed #3d8bff;border-radius:10px;color:#e8edf6}
  button{margin-top:1rem;width:100%;padding:.85rem;border:0;border-radius:10px;background:#3d8bff;color:#fff;font:600 1rem system-ui;cursor:pointer}
  button:disabled{opacity:.4;cursor:not-allowed}
  #out{margin-top:1rem;color:#34d399;font-weight:600}
  #out.err{color:#ff7a7a}
</style>
</head>
<body>
<main>
  <h1>Conversor de garajes</h1>
  <p>1. Elige tu HTML antiguo. 2. Pulsa el botón. 3. Guarda <b>garajes-data.js</b> junto a <b>index.html</b>.</p>
  <input type="file" id="file" accept=".html,.htm,.txt">
  <button id="go" disabled>Convertir y descargar garajes-data.js</button>
  <div id="out" role="status"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const dec = s => new DOMParser().parseFromString(s, "text/html").documentElement.textContent;
const clean = s => dec(s.replace(/\s+/g, " ")).trim();
let text = "";

$("#file").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  text = await f.text();
  $("#go").disabled = false;
  $("#out").textContent = "";
});

$("#go").addEventListener("click", () => {
  const out = $("#out");
  out.className = "";
  const src = text.replace(/<!--[\s\S]*?-->/g, "");
  const chunks = src.split(/<div\s+class="propiedad"/).slice(1);
  const carRe = /class="flip-front"[^>]*>[\s\S]*?<img[^>]*?src="([^"]+)"[\s\S]*?<h3>([\s\S]*?)<\/h3>[\s\S]*?class="flip-back"[^>]*>[\s\S]*?<img[^>]*?src="([^"]+)"[\s\S]*?<h3>([\s\S]*?)<\/h3>/g;

  const garages = []; let total = 0;
  chunks.forEach((ch, i) => {
    const h2 = ch.match(/<h2>([\s\S]*?)<\/h2>/);
    if (!h2) return;
    const title = clean(h2[1]);
    const m = title.match(/^(.*?)\s*\((.*)\)\s*$/);
    const cover = ch.match(/<img[^>]*?src="([^"]+)"/);
    const id = ch.match(/toggleCoches\('([^']+)'/);
    const cars = [];
    for (const c of ch.matchAll(carRe)) cars.push([clean(c[2]), clean(c[4]), c[3].trim(), c[1].trim()]);
    total += cars.length;
    garages.push({ id: id ? id[1] : "g" + i, name: m ? m[1] : title, type: m ? m[2] : "Vehículos", cover: cover ? cover[1].trim() : "", cars });
  });

  if (!total) { out.className = "err"; out.textContent = "No encontré vehículos. ¿Es el archivo correcto?"; return; }

  const js = "window.GARAGES = " + JSON.stringify(garages, null, 1) + ";\n";
  const a = Object.assign(document.createElement("a"), {
    href: URL.createObjectURL(new Blob([js], { type: "text/javascript" })),
    download: "garajes-data.js"
  });
  a.click();
  out.textContent = `Listo: ${garages.length} garajes y ${total} vehículos.`;
});
</script>
</body>
</html>
